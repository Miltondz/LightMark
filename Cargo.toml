[package]
name = "lightmark"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18"
ropey = { version = "2.0.0-beta.1", features = ["metric_lines_unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
regex = "1"
rfd = "0.15"
time = "0.3"
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
arboard = "3"
